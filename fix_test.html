<!DOCTYPE html>
<html>
<head>
<style>
  @media print {
    @page { size: A4; margin: 0; }
    body { margin: 0; }
  }
  .page {
    width: 210mm;
    min-height: 297mm;
    padding: 3cm;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: #f0f0f0;
  }
</style>
</head>
<body>
  <div class="page">
    <div>TOP</div>
    <div>MIDDLE</div>
    <div>BOTTOM</div>
  </div>
</body>
</html>
